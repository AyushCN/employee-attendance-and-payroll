{% extends "base.html" %}
{% block title %}Attendance{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Mark Attendance & Overtime</h1>
    <p class="subtitle">Total working days: <strong>{{ total_working_days }}</strong></p>

    <form method="POST" class="form">
        <div class="form-group">
            <label>Employee</label>
            <select name="emp_id" required>
                <option value="">-- Select Employee --</option>
                {% for emp in employees %}
                <option value="{{ emp.emp_id }}">{{ emp.emp_id }} — {{ emp.emp_name }} ({{ emp.dept_name }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Days Present (0 – {{ total_working_days }})</label>
                <input type="number" name="days_present" min="0" max="{{ total_working_days }}" required></div>
            <div class="form-group"><label>Overtime Hours</label>
                <input type="number" step="0.1" name="overtime_hours" value="0.0"></div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Attendance</button>
        </div>
    </form>
</div>
{% endblock %}

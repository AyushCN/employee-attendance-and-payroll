{% extends "base.html" %}
{% block title %}Add Employee{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Add New Employee</h1>
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group"><label>Employee ID *</label><input type="text" name="emp_id" required></div>
            <div class="form-group"><label>Employee Name *</label><input type="text" name="emp_name" required></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Department ID *</label><input type="text" name="dept_id" required></div>
            <div class="form-group"><label>Department Name *</label><input type="text" name="dept_name" required></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Fixed Basic Monthly Salary *</label><input type="number" step="0.01" name="basic_salary" required></div>
            <div class="form-group"><label>Overtime Rate / Hour</label><input type="number" step="0.01" name="overtime_rate" value="25.0"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Days Present</label><input type="number" name="days_present" value="0" min="0" max="22"></div>
            <div class="form-group"><label>Overtime Hours</label><input type="number" step="0.1" name="overtime_hours" value="0.0"></div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Employee</button>
            <a href="{{ url_for('employees') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

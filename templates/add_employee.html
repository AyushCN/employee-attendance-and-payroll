{% extends "base.html" %}
{% block title %}Add Employee - Payroll System{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Add New Employee</h1>
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group">
                <label for="emp_id">Employee ID *</label>
                <input type="text" id="emp_id" name="emp_id" required>
            </div>
            <div class="form-group">
                <label for="emp_name">Employee Name *</label>
                <input type="text" id="emp_name" name="emp_name" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="dept_id">Department ID *</label>
                <input type="text" id="dept_id" name="dept_id" required>
            </div>
            <div class="form-group">
                <label for="dept_name">Department Name *</label>
                <input type="text" id="dept_name" name="dept_name" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="basic_salary">Fixed Basic Monthly Salary *</label>
                <input type="number" step="0.01" id="basic_salary" name="basic_salary" required>
            </div>
            <div class="form-group">
                <label for="overtime_rate">Overtime Rate / Hour</label>
                <input type="number" step="0.01" id="overtime_rate" name="overtime_rate" value="25.0">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="days_present">Days Present</label>
                <input type="number" id="days_present" name="days_present" value="0" min="0" max="22">
            </div>
            <div class="form-group">
                <label for="overtime_hours">Overtime Hours</label>
                <input type="number" step="0.1" id="overtime_hours" name="overtime_hours" value="0.0">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Employee</button>
            <a href="{{ url_for('employees') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

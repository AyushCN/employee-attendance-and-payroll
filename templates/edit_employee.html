{% extends "base.html" %}
{% block title %}Edit Employee{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Edit: {{ emp.emp_name }}</h1>
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group"><label>Employee ID</label><input type="text" value="{{ emp.emp_id }}" disabled></div>
            <div class="form-group"><label>Employee Name</label><input type="text" name="emp_name" value="{{ emp.emp_name }}"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Department ID</label><input type="text" name="dept_id" value="{{ emp.department.dept_id }}"></div>
            <div class="form-group"><label>Department Name</label><input type="text" name="dept_name" value="{{ emp.department.dept_name }}"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Fixed Basic Salary</label><input type="number" step="0.01" name="basic_salary" value="{{ emp.basic_salary }}"></div>
            <div class="form-group"><label>Overtime Rate / Hour</label><input type="number" step="0.01" name="overtime_rate" value="{{ emp.overtime_rate_per_hour }}"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Days Present</label><input type="number" name="days_present" value="{{ emp.days_present }}" min="0" max="22"></div>
            <div class="form-group"><label>Overtime Hours</label><input type="number" step="0.1" name="overtime_hours" value="{{ emp.overtime_hours }}"></div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Employee</button>
            <a href="{{ url_for('employees') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
